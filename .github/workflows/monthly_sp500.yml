name: Monthly S&P 500 collection

on:
  schedule:
    # 06:00 UTC on the 2nd of every month (collects the previous calendar month).
    - cron: "0 6 2 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Optional month to collect (YYYY-MM). Blank = previous month."
        required: false
        default: ""

# Only the job that pushes needs write access to repository contents.
permissions:
  contents: write

# Never run two collections at once (avoids conflicting pushes).
concurrency:
  group: monthly-sp500
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect S&P 500 data
        env:
          MONTH: ${{ inputs.month }}
        run: |
          if [ -n "$MONTH" ]; then
            python -m src.fetch_sp500 --month "$MONTH"
          else
            python -m src.fetch_sp500
          fi

      - name: Commit and push if the CSV changed
        run: |
          git add data/sp500_daily.csv
          if git diff --cached --quiet; then
            echo "No changes to data/sp500_daily.csv; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update S&P 500 daily prices"
          git push
